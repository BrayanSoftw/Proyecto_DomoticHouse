<h2>Iniciar sesión</h2>
<form (ngSubmit)="login()" #loginForm="ngForm">
  <label for="email">Correo o celular:</label>
  <input type="text" id="email" name="email" [(ngModel)]="email" required><br><br>

  <label for="password">Contraseña:</label>
  <input type="password" id="password" name="password" [(ngModel)]="password" required><br><br>

  <button type="submit" [disabled]="!loginForm.form.valid">Ingresar</button>
</form>

<p *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</p>
