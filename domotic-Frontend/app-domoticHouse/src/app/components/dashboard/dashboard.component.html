<mat-toolbar color="primary">
  <span>Dashboard Domótico</span>
</mat-toolbar>

<div class="contenedor">
  <div class="banner">
    <h1>Bienvenido a tu hogar inteligente</h1>
    <p>Automatiza y controla tu casa con un solo clic</p>
  </div>

  <div class="paneles">
    <mat-card class="panel">
      <mat-icon>lightbulb</mat-icon>
      <h2>Iluminación</h2>
      <p>Controla las luces de cada habitación.</p>
      <button mat-raised-button color="accent">Administrar</button>
    </mat-card>

    <mat-card class="panel">
      <mat-icon>thermostat</mat-icon>
      <h2>Temperatura</h2>
      <p>Ajusta la temperatura y la climatización.</p>
      <button mat-raised-button color="accent">Administrar</button>
    </mat-card>

    <mat-card class="panel">
      <mat-icon>lock</mat-icon>
      <h2>Seguridad</h2>
      <p>Monitorea cámaras y cerraduras inteligentes.</p>
      <button mat-raised-button color="accent">Administrar</button>
    </mat-card>
  </div>
</div>
